web:
  url: https://portal-dc02.lotusflare.com
  viewportWidth: 1440
  viewportHeight: 900

tasks:
  - name: Open operator 29 Home
    flow:
      - goto: https://portal-dc02.lotusflare.com/#/29
      - aiWaitFor: The left navigation sidebar is visible and the Home page has finished loading
      - aiAssert: Sidebar and page header are aligned with no overlapping text

  - name: Check API Product Orders alignment
    flow:
      - goto: https://portal-dc02.lotusflare.com/#/29/operate-apis/api-product-orders
      - aiWaitFor: The API Product Orders table or list is visible
      - aiAssert: Column headers align with the values under them and no primary action is clipped

  - name: Verify Offers page layout
    flow:
      - goto: https://portal-dc02.lotusflare.com/#/29/pc/offers
      - aiWaitFor: The Offers page content is visible
      - aiAssert: Primary action buttons are fully legible and prices or dates are properly formatted with no NaN text

  - name: Verify Settings page
    flow:
      - goto: https://portal-dc02.lotusflare.com/#/29/settings/tenant-localization
      - aiWaitFor: The Settings page content is visible beside the sidebar
      - aiAssert: Settings content is readable with no overlapping panels
